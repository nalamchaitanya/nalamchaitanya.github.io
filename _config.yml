# Site identity
locale: "en-US"
title: "Chaitanya Nalam"
title_separator: "-"
name: "Chaitanya Nalam"
description: "Chaitanya Nalam — graph algorithms, cuts, and connectivity."
url: "https://nalamchaitanya.github.io"
baseurl: ""
repository: "nalamchaitanya/nalamchaitanya.github.io"

# AcademicPages profile sidebar. The photo lives in images/.
author:
  name: "Chaitanya Nalam"
  avatar: "Profile.jpg"
  employer: "University of Michigan"
  employer_url: "https://cse.engin.umich.edu/"
  # Obfuscation deters basic harvesting; it is not encryption.
  email_encoded: "bmFsYW1zYWlAdW1pY2guZWR1"
  email_display: "nalamsai [at] umich [dot] edu"
  github: "nalamchaitanya"
  linkedin: "nalamchaitanya"

# Preserve the existing analytics property; only load it in production.
google_analytics: "G-GRLZBH97CV"
breadcrumbs: false
atom_feed:
  hide: true

# AcademicPages is vendored in _layouts, _includes, _sass, and assets.
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - THEME.md
  - MENU
  - jemdoc.py
  - jemdoc.css
  - .bundle
  - vendor
  - node_modules

compress_html:
  clippings: all
  ignore:
    envs: development
